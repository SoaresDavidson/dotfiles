general {
    ignore_empty_input = true
}

background {
    path = screenshot
    color = rgba(17, 17, 17, 1.0)
    blur_passes = 2
    blur_size = 8
    brightness = 0.9
    vibrancy = 0.17
}

label {
    text = cmd[update:1000] date +%H:%M
    font_size = 90
    font_family = JetBrains Mono
    color = rgba(254, 254, 254, 1.0)
    position = 0, 140
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = Noto Sans
    color = rgba(200, 200, 200, 1.0)
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    size = 25%, 6%
    outline_thickness = 3
    rounding = 15
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    inner_color = rgba(17, 17, 17, 0.8)
    font_color = rgb(240, 240, 240)
    placeholder_text = <i>Senha...</i>
    fade_on_empty = true
    position = 0, -60
    halign = center
    valign = center
}
