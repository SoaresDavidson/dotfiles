# Habilita o uso do mouse (para clicar em painéis, redimensionar janelas e rolar o histórico)
set -g mouse on

# Muda o prefixo de Ctrl+b para Ctrl+a (muito mais confortável para a mão)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Começa a numeração das janelas e painéis no 1 em vez do 0 (mais fácil de alcançar no teclado)
set -g base-index 1
set -g pane-base-index 1

# Atalhos mais intuitivos para dividir a tela (usa | para vertical e - para horizontal)
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Lista de plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Habilita a restauração automática quando o tmux é iniciado
set -g @continuum-restore 'on'

# Inicializa o TMUX plugin manager (deve ser a ÚLTIMA linha do arquivo)
run '~/.tmux/plugins/tpm/tpm'